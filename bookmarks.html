<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🔖 Bookmark Tools</title>
  <link rel="icon" href="icon16.png">
  <style>
    /* Shared look for every view; views add their own styles in <view>.css */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e; color: #e0e0e0; min-height: 100vh; font-size: 13px;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    header h1 { font-size: 20px; font-weight: 700; }
    .tabs { display: flex; gap: 4px; flex: 1; }
    .tabs button {
      background: none; border: none; color: #888; cursor: pointer;
      font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 6px;
    }
    .tabs button:hover { color: #ccc; background: #16213e; }
    .tabs button.active { color: #fff; background: #0f3460; }
    .notice { color: #888; font-size: 12px; margin-bottom: 12px; }
    .notice:empty { display: none; }
    .view { display: none; }
    .view.active { display: block; }

    /* Building blocks views can use */
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar .grow { flex: 1; }
    .btn {
      padding: 7px 14px; background: #16213e; color: #e0e0e0;
      border: 1px solid #2a2a4a; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: #1b2a4a; }
    .btn.primary { background: #e94560; border-color: #e94560; color: #fff; }
    .btn.primary:hover { background: #c73650; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    button.link {
      background: none; border: none; color: #e94560;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button.link:hover { color: #ff6b81; }
    select, input[type="text"], input[type="search"] {
      padding: 6px 8px; border: 1px solid #333; border-radius: 6px;
      background: #0f3460; color: #fff; font-size: 13px;
    }
    select:focus, input:focus { outline: none; border-color: #e94560; }
    .group { margin-bottom: 22px; }
    .group-header {
      display: flex; align-items: baseline; gap: 14px;
      padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid #2a2a4a;
    }
    .group-header h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; }
    .group-header .count { color: #555; font-size: 12px; flex: 1; }
    .row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; }
    .row:hover { background: #16213e; }
    .row img.fav { width: 16px; height: 16px; flex-shrink: 0; }
    .row .title { min-width: 0; flex: 1; overflow: hidden; }
    .row .title a {
      display: block; color: #e0e0e0; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row .title a:hover { text-decoration: underline; }
    .row .sub { color: #666; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .muted { color: #666; }
    .empty { color: #555; text-align: center; padding: 28px; }
    .status-line { color: #888; font-size: 12px; min-height: 16px; margin-top: 8px; }
  </style>
  <link rel="stylesheet" href="triage.css">
  <link rel="stylesheet" href="deadlinks.css">
  <link rel="stylesheet" href="tidy.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🔖 Bookmarks</h1>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <div class="notice" id="notice"></div>
    <main id="views"></main>
  </div>
  <script src="bmlib.js"></script>
  <script src="triage.js"></script>
  <script src="deadlinks.js"></script>
  <script src="tidy.js"></script>
  <script src="bookmarks.js"></script>
</body>
</html>
