<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🚮 Closed Tabs</title>
  <link rel="icon" href="/assets/icons/icon16.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }

    header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header .total { color: #888; font-size: 13px; flex: 1; }
    header input {
      width: 240px; padding: 7px 10px;
      border: 1px solid #333; border-radius: 6px;
      background: #0f3460; color: #fff; font-size: 13px;
    }
    header input::placeholder { color: #666; }
    header input:focus { outline: none; border-color: #e94560; }

    button.link {
      background: none; border: none; color: #e94560;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button.link:hover { color: #ff6b81; }

    .group { margin-bottom: 22px; }
    .group-header {
      display: flex; align-items: baseline; gap: 14px;
      padding-bottom: 6px; margin-bottom: 6px;
      border-bottom: 1px solid #2a2a4a;
    }
    .group-header h2 {
      font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.5px; color: #888;
    }
    .group-header .count { color: #555; font-size: 12px; flex: 1; }

    .item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; border-radius: 6px;
    }
    .item:hover { background: #16213e; }
    .item img { width: 16px; height: 16px; flex-shrink: 0; }
    .item a {
      color: #e0e0e0; text-decoration: none; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .item a:hover { text-decoration: underline; }
    .item .host {
      color: #555; font-size: 11px; flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item .time { color: #555; font-size: 11px; flex-shrink: 0; }
    .item .remove {
      background: none; border: none; color: #555;
      font-size: 16px; line-height: 1; cursor: pointer;
      padding: 0 4px; visibility: hidden;
    }
    .item:hover .remove { visibility: visible; }
    .item .remove:hover { color: #e94560; }

    .empty { color: #555; font-size: 13px; text-align: center; padding: 60px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🚮 Closed Tabs</h1>
      <span class="total" id="total"></span>
      <input type="search" id="filter" placeholder="Filter by title or URL">
      <button class="link" id="clearAll">Delete all</button>
    </header>
    <div id="groups"></div>
  </div>
  <script src="closed.js"></script>
</body>
</html>
