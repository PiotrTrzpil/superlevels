<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🚮 Closed Tabs</title>
  <link rel="icon" href="/assets/icons/icon16.png">
  <link rel="stylesheet" href="../../shared/theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }

    header {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 14px; margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header .total { color: var(--text-muted); font-size: 13px; flex: 1; }
    header input {
      width: 240px; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--field); color: var(--text); font-size: 13px;
    }
    header input::placeholder { color: var(--text-faint); }
    header input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    button.link {
      background: none; border: none; color: var(--accent);
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button.link:hover { color: var(--accent-soft); }

    .group { margin-bottom: 22px; }
    .group-header {
      display: flex; align-items: center; gap: 14px;
      padding-bottom: 6px; margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .group-header h2 {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-2);
    }
    .group-header h2::before {
      content: ''; width: 3px; height: 12px; border-radius: 2px;
      background: var(--accent); flex-shrink: 0;
    }
    .group-header .count { color: var(--text-faint); font-size: 12px; flex: 1; }

    .item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; border-radius: var(--radius-sm);
    }
    .item:hover { background: var(--surface-2); }
    .item img { width: 16px; height: 16px; flex-shrink: 0; }
    .item a {
      color: var(--text); text-decoration: none; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .item a:hover { color: var(--accent-soft); }
    .item .host {
      color: var(--text-faint); font-size: 11px; flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item .tab-group {
      font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px;
      flex-shrink: 0; max-width: 160px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--group-color); border: 1px solid var(--group-color);
    }
    /* Chrome's tab group colors */
    .tab-group-grey { --group-color: #9aa0a6; }
    .tab-group-blue { --group-color: #8ab4f8; }
    .tab-group-red { --group-color: #f28b82; }
    .tab-group-yellow { --group-color: #fdd663; }
    .tab-group-green { --group-color: #81c995; }
    .tab-group-pink { --group-color: #ff8bcb; }
    .tab-group-purple { --group-color: #c58af9; }
    .tab-group-cyan { --group-color: #78d9ec; }
    .tab-group-orange { --group-color: #fcad70; }
    .item .time { color: var(--text-faint); font-variant-numeric: tabular-nums; font-size: 11px; flex-shrink: 0; }
    .item .action {
      background: none; border: none; color: var(--text-dim);
      font-size: 16px; line-height: 1; cursor: pointer;
      padding: 0 4px; visibility: hidden;
    }
    .item .action:not(.remove) { font-size: 13px; opacity: 0.6; }
    .item:hover .action { visibility: visible; }
    .item .action:not(.remove):hover { opacity: 1; }
    .item .remove:hover { color: var(--negative); }

    .status { color: var(--text-muted); font-size: 12px; margin: -10px 0 16px; min-height: 1em; }
    .status a { color: var(--accent); }

    .empty { color: var(--text-faint); font-size: 13px; text-align: center; padding: 60px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🚮 Closed Tabs</h1>
      <span class="total" id="total"></span>
      <input type="search" id="filter" placeholder="Filter by title or URL">
      <button class="link" id="bookmarkAll" title="Move the tabs shown to the bookmarks inbox">Bookmark all</button>
      <button class="link" id="clearAll">Delete all</button>
    </header>
    <div class="status" id="status"></div>
    <div id="groups"></div>
  </div>
  <script src="../bookmarks/bmlib.js"></script>
  <script src="closed.js"></script>
</body>
</html>
